function stroke(i,part=1){const s=paths[i],p=s.p;if(p.length<2)return;m.beginPath();m.moveTo(p[0][0],p[0][1]);let left=lens[i]*part;for(let j=1;j<p.length;j++){const a=p[j-1],b=p[j],d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(left>=d){m.lineTo(b[0],b[1]);left-=d}else{if(d>0)m.lineTo(a[0]+(b[0]-a[0])*left/d,a[1]+(b[1]-a[1])*left/d);break}}m.strokeStyle='white';m.lineWidth=s.w;m.lineCap='round';m.lineJoin='round';m.stroke()}
function tick(now){requestAnimationFrame(tick);if(!art.complete||paused)return;let elapsed=(now-origin)/1000,cycle=duration+hold+erase;if(elapsed>=cycle){reset();elapsed=0}
const fraction=Math.min(1,elapsed/duration),target=total*fraction;
while(drawn<paths.length && cumulative[drawn]<=target){stroke(drawn);drawn++}
// draw only the current partial stroke on a temporary mask so it can advance smoothly
pm.clearRect(0,0,W,H);pm.drawImage(mask,0,0);
if(drawn<paths.length && elapsed<duration){const s=paths[drawn],prev=drawn?cumulative[drawn-1]:0;const part=Math.max(0,Math.min(1,(target-prev)/Math.max(0.001,lens[drawn])));const p=s.p;pm.beginPath();pm.moveTo(p[0][0],p[0][1]);let left=lens[drawn]*part;for(let j=1;j<p.length;j++){const a=p[j-1],b=p[j],d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(left>=d){pm.lineTo(b[0],b[1]);left-=d}else{if(d>0)pm.lineTo(a[0]+(b[0]-a[0])*left/d,a[1]+(b[1]-a[1])*left/d);break}}pm.strokeStyle='white';pm.lineWidth=s.w;pm.lineCap='round';pm.lineJoin='round';pm.stroke()}
ic.clearRect(0,0,W,H);ic.drawImage(art,0,0);ic.globalCompositeOperation='destination-in';ic.drawImage(partial,0,0);ic.globalCompositeOperation='source-over';ctx.fillStyle='#b9b8b0';ctx.fillRect(0,0,W,H);
if(elapsed>duration+hold){const v=(elapsed-duration-hold)/erase;ctx.save();ctx.translate(Math.sin(v*85)*(1-v)*6,0);ctx.globalAlpha=1-v;ctx.drawImage(ink,0,0);ctx.restore();document.getElementById('status').textContent='Shake to erase'}else{ctx.drawImage(ink,0,0);document.getElementById('status').textContent=elapsed<duration?'Sketching '+Math.round(fraction*100)+'%':'Finished'}
}
art.onload=()=>{reset();requestAnimationFrame(tick)};
document.getElementById('replay').onclick=()=>{paused=false;document.getElementById('pause').textContent='Pause';reset()};document.getElementById('pause').onclick=()=>{paused=!paused;if(paused){pausedAt=performance.now();document.getElementById('pause').textContent='Resume'}else{origin+=performance.now()-pausedAt;document.getElementById('pause').textContent='Pause'}};document.getElementById('duration').onchange=e=>{duration=Number(e.target.value);reset()};

// Tap the display with two fingers to reveal or hide playback controls.
document.querySelector('.screen').addEventListener('touchstart',e=>{if(e.touches.length>=2){e.preventDefault();document.querySelector('.controls').classList.toggle('visible')}},{passive:false});
document.querySelector('.screen').addEventListener('dblclick',()=>document.querySelector('.controls').classList.toggle('visible'));
</script></body></html>
